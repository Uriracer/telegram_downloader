name: Release

# Publish a new version:  bump tgdl/__init__.py __version__, update CHANGELOG.md,
# commit, then:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check version and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - id: version
        name: Tag must match tgdl.__version__
        run: echo "version=$(python scripts/check_version.py "$TAG")" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m "not live" -q

  python-dist:
    name: Wheel and sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  docker:
    name: Docker image (amd64 + arm64) → GHCR
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"   # no build-record artifact (see the publish job)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/telegram-downloader" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: GitHub Release
    needs: [check, python-dist, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Download by name: docker/build-push-action also uploads a ".dockerbuild"
      # build record as an artifact, which download-artifact cannot extract.
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: artifacts
      - name: Checksums
        working-directory: artifacts
        run: sha256sum ./* > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/check_version.py "$TAG" --notes > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Telegram Downloader ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: artifacts/*
